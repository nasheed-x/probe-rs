[package]
name = "flash-app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
probe-rs = { path = "../probe-rs", default-features = false, features = ["builtin-targets"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[patch."https://github.com/Yatekii/nusb"]
nusb = { path = "../nusb-webusb" }

[patch."https://github.com/Yatekii/hidapi-rs"]
hidapi = { path = "../hidapi-webusb" }
